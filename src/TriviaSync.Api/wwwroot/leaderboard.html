<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings · Groove</title>
  <link rel="stylesheet" href="/css/style.css?v=4.11">
  <style>
    .panel { display: none; }
    .panel.is-active { display: block; animation: fade-in .15s ease-out; }
    .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .filters .field { flex: 1; min-width: 220px; }
    .pin-lookup { display: flex; gap: 8px; }
    .pin-lookup .input { width: 130px; letter-spacing: 0.1em; text-align: center; font-variant-numeric: tabular-nums; }
    .rounds { display: flex; gap: 6px; flex-wrap: wrap; }
    .updated { font-size: 0.8125rem; color: var(--text-3); }
  </style>
</head>
<body class="has-tabbar">
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand" aria-label="Groove home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Groove</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/player.html">Join</a>
        <a href="/tournaments.html">Tournaments</a>
        <a href="/host.html">Host</a>
    <a href="/leaderboard.html" aria-current="page">Standings</a>
        <a href="/admin.html" data-admin-only hidden>Admin</a>
      </nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="spread mb-6">
        <div>
          <h1>Standings</h1>
          <p class="muted mt-1">Each tournament has its own standings. Quick games have a separate board. Both update automatically.</p>
        </div>
        <div class="row-wrap" id="exportButtons" hidden>
          <button type="button" class="btn btn-secondary btn-sm" id="exportCsv"><span data-icon="download"></span>Quick games CSV</button>
          <button type="button" class="btn btn-secondary btn-sm" id="exportExcel"><span data-icon="download"></span>Quick games Excel</button>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="panelTournament" aria-selected="true">Tournaments</button>
        <button class="tab" role="tab" data-tab="panelAllTime">Quick games</button>
      </div>

      <!-- Tournament -->
      <section class="panel is-active" id="panelTournament" role="tabpanel">
        <div class="card mb-4">
          <div class="field">
            <label class="label" for="tournamentSelect">Tournament</label>
            <select class="select" id="tournamentSelect"><option value="">Loading…</option></select>
          </div>
        </div>
        <div id="tournamentBody"></div>
      </section>

      <!-- All time -->
      <section class="panel" id="panelAllTime" role="tabpanel">
        <div class="podium mb-6" id="allTimePodium" hidden></div>
        <div class="card">
          <div class="spread mb-4">
            <div style="max-width: 360px; flex: 1;">
              <label class="sr-only" for="search">Search players</label>
              <input class="input" id="search" type="search" placeholder="Search by name">
            </div>
            <span class="updated" id="allTimeUpdated"></span>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>#</th><th>Player</th><th class="right">Points</th><th class="right hide-sm">Games</th><th class="right">Accuracy</th><th class="right hide-sm">Best streak</th><th class="hide-sm">Last played</th></tr></thead>
              <tbody id="allTimeTable"><tr><td colspan="7" class="empty-row">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>


  <nav class="tabbar" aria-label="Main">
    <a href="/"><span data-icon="home"></span>Home</a>
    <a href="/player.html"><span data-icon="gamepad"></span>Play</a>
    <a href="/tournaments.html"><span data-icon="users"></span>Tournaments</a>
    <a href="/leaderboard.html" aria-current="page"><span data-icon="trophy"></span>Standings</a>
  </nav>

  <script src="/js/ui.js?v=4.11"></script>
  <script src="/js/lib/signalr.min.js"></script>
  <script src="/js/live.js?v=4.11"></script>
  <script>
  (function () {
    const $ = id => document.getElementById(id);
    let activeTab = 'panelTournament';
    let tournamentId = new URLSearchParams(location.search).get('tournament') || '';
    let searchTimer = null;

    function podium(container, top, nameKey, scoreKey) {
      if (!top.length) { container.hidden = true; return; }
      container.hidden = false;
      container.innerHTML = [1, 0, 2].map(i => {
        const p = top[i];
        return `
          <div class="podium-place p${i + 1} ${p ? '' : 'is-empty'}">
            <div class="podium-name">${p ? UI.escape(p[nameKey]) : ''}</div>
            <div class="podium-score">${p ? UI.formatNumber(p[scoreKey]) + ' pts' : ''}</div>
            <div class="podium-block">${i + 1}</div>
          </div>`;
      }).join('');
    }

    function selectTab(id) {
      activeTab = id;
      document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === id)));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('is-active', p.id === id));
      if (id === 'panelAllTime') loadAllTime();
      else loadTournaments();
    }

    // Tournaments (public) ---------------------------------------------------
    async function loadTournaments(quiet) {
      const select = $('tournamentSelect');
      try {
        const list = await UI.api('/api/tournaments/public', { auth: false });
        if (!list.length) {
          select.innerHTML = '<option value="">No tournaments yet</option>';
          $('tournamentBody').innerHTML = '<div class="empty"><h3>No tournaments yet</h3><p>Tournament standings show up here once a host creates one.</p></div>';
          return;
        }
        select.innerHTML = list.map(t =>
          `<option value="${UI.escape(t.id)}">${UI.escape(t.name)} · ${UI.escape(t.hostName)}</option>`).join('');
        if (!tournamentId || !list.some(t => t.id === tournamentId)) tournamentId = list[0].id;
        select.value = tournamentId;
        loadTournament(quiet);
      } catch (err) {
        select.innerHTML = `<option value="">${UI.escape(err.message)}</option>`;
      }
    }

    let followed = null;
    /** Live updates for whichever tournament is selected. */
    function followTournament(id) {
      if (followed === id) return;
      if (followed) Live.unsubscribe(`tournament:${followed}:pub`);
      followed = id;
      if (id) Live.subscribe(`tournament:${id}:pub`);
    }

    async function loadTournament(quiet) {
      if (!tournamentId) return;
      followTournament(tournamentId);
      const body = $('tournamentBody');
      if (!quiet) body.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const data = await UI.api(`/api/tournaments/${encodeURIComponent(tournamentId)}/standings`);
        history.replaceState(null, '', `?tournament=${encodeURIComponent(tournamentId)}`);
        const t = data.tournament;
        const rows = data.standings;
        body.innerHTML = `
          <div class="spread mb-4">
            <div>
              <h2>${UI.escape(t.name)}</h2>
              <p class="subtle mt-1">Hosted by ${UI.escape(t.hostName)} · ${t.playedCount} of ${t.sessionCount} sessions played${t.activeCount ? ` · <span class="text-lime">${t.activeCount} open now</span>` : ''}</p>
            </div>
            <a class="btn btn-secondary btn-sm" href="/tournament.html?id=${encodeURIComponent(t.id)}">Tournament page</a>
          </div>
          <div class="podium mb-6" id="tournamentPodium" hidden></div>
          <div class="card">
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>#</th><th>Player</th><th class="right">Points</th><th class="right hide-sm">Sessions</th><th class="right">Correct</th></tr></thead>
                <tbody>${rows.length ? rows.map(p => `
                  <tr class="${p.isMe ? 'is-me' : ''}">
                    <td>${UI.rankBadge(p.rank)}</td>
                    <td><div class="player-cell">${UI.avatar(p.displayName)}${UI.escape(p.displayName)}${p.isMe ? ' <span class="badge badge-accent">You</span>' : ''}</div></td>
                    <td class="right score">${UI.formatNumber(p.totalScore)}</td>
                    <td class="right hide-sm num">${p.sessionsPlayed}</td>
                    <td class="right num">${p.correct}/${p.answered}</td>
                  </tr>`).join('') : '<tr><td colspan="5" class="empty-row">No scores yet.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>`;
        podium($('tournamentPodium'), rows.slice(0, 3), 'displayName', 'totalScore');
      } catch (err) {
        body.innerHTML = `<div class="empty"><h3>Tournament not found</h3><p>${UI.escape(err.message)}</p></div>`;
      }
    }

    // All time ---------------------------------------------------------------
    async function loadAllTime() {
      const tbody = $('allTimeTable');
      const search = $('search').value.trim();
      try {
        const players = await UI.api(`/api/leaderboard?limit=100&search=${encodeURIComponent(search)}`);
        $('allTimeUpdated').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        podium($('allTimePodium'), search ? [] : players.slice(0, 3), 'fullName', 'totalPointsAllTime');
        tbody.innerHTML = players.length ? players.map((p, i) => `
          <tr>
            <td>${UI.rankBadge(i + 1)}</td>
            <td><div class="player-cell">${UI.avatar(p.fullName)}${UI.escape(p.fullName)}</div></td>
            <td class="right score">${UI.formatNumber(p.totalPointsAllTime)}</td>
            <td class="right hide-sm num">${p.quizzesPlayed || 0}</td>
            <td class="right num">${Math.round(p.accuracyPercentage || 0)}%</td>
            <td class="right hide-sm num">${p.highestStreak || 0}</td>
            <td class="hide-sm muted">${UI.stamp(p.lastActive)}</td>
          </tr>`).join('')
          : `<tr><td colspan="7" class="empty-row">${search ? 'No players match your search.' : 'No scores yet. They appear after the first game finishes.'}</td></tr>`;
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-row">${UI.escape(err.message)}</td></tr>`;
      }
    }

    // Exports (hosts and admins only) ----------------------------------------
    function renderChrome() {
      UI.renderAccount($('account'));
      $('exportButtons').hidden = !Session.canHost();
    }

    async function exportAll(kind, button) {
      try {
        await UI.busy(button, () => UI.download(`/api/leaderboard/export/${kind}`, `Groove_Leaderboard.${kind === 'csv' ? 'csv' : 'xls'}`));
      } catch (err) {
        UI.toast(err.message, 'error');
      }
    }

    document.querySelectorAll('.tab').forEach(t => { t.onclick = () => selectTab(t.dataset.tab); });
    $('tournamentSelect').onchange = e => { tournamentId = e.target.value; loadTournament(); };
    $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadAllTime, 300); });
    $('exportCsv').onclick = e => exportAll('csv', e.currentTarget);
    $('exportExcel').onclick = e => exportAll('excel', e.currentTarget);

    // Live: scores, new tournaments and quick-game results appear as they happen.
    Live.subscribe('public');
    Live.on('standings', () => loadTournament(true));
    Live.on('details', () => loadTournaments(true));
    Live.on('tournaments', () => loadTournaments(true));
    Live.on('deleted', () => loadTournaments(true));
    Live.on('quick', () => { if (!$('search').value) loadAllTime(); });
    Live.onReconnect(() => { loadTournaments(true); loadAllTime(); });

    Session.onChange(() => { renderChrome(); loadTournament(true); });
    renderChrome();
    loadTournaments();
  })();
  </script>
</body>
</html>
